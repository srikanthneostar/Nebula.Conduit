server:
  host: "0.0.0.0"
  port: 8080

auth:
  jwt_secret: "your_secure_secret_here"
  token_expiry_hours: 24

tls_config:
  enabled: true
  cert_file: "commons/cert.pem"
  key_file: "commons/key.pem"

database:
  path: "Nebula.Conduit.db"

paths:
  python_scripts_home: "C:/nebula.rivulet/fabric/build/lib/algorithms"
  allowed_paths:
    # - "/opt/pyexec/scripts"
    - "C:/nebula.rivulet/fabric/build/lib/algorithms"

setlog:
  loglevel : "info"