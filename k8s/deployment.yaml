---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-conduit
  namespace: core-insights-nebula
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-conduit
  template:
    metadata:
      labels:
        app: nebula-conduit
    spec:
      progressDeadlineSeconds: 900
      containers:
      - name: nebula-conduit
        image: srikanthneostar/nebula-conduit:latest
        ports:
        - containerPort: 8080
        imagePullPolicy: Always
        env:
        - name: TZ
          value: Asia/Kolkata
        - name: NEBULA_CONDUIT_HOME
          value: /app/commons
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
      imagePullSecrets:
      - name: regcred
