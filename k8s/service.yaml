apiVersion: v1
kind: Service
metadata:
  name: nebula-conduit
  labels:
    app: nebula-conduit
spec:
  type: LoadBalancer
  ports:
  - port: 443
    targetPort: 8080
    protocol: TCP
    name: https
  selector:
    app: nebula-conduit
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nebula-conduit-config
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080

    auth:
      jwt_secret: "your_secure_secret_here"
      token_expiry_hours: 24

    tls_config:
      enabled: true
      cert_file: "commons/cert.pem"
      key_file: "commons/key.pem"

    database:
      path: "Nebula.Conduit.db"

    paths:
      python_scripts_home: "/opt/scripts"
      allowed_paths:
        - "/opt/scripts"

    setlog:
      loglevel: "info"
