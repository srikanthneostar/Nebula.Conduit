# .gitlab-ci.yml - Build, push to Docker Hub, update Kubernetes deployment
image: docker:24.0.2

stages:
  - docker-login
  - image-build-push
  - kubernetes-deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  REGISTRY_TAG: "${DOCKER_USR}/nebula-conduit:${CI_PIPELINE_ID}"
  KUBECONFIG: /home/gitlab-runner/.kube/config-$DEPLOY_TO

services:
  - name: docker:24-dind
    alias: docker

default:
  tags:
    - develop

# -------- Docker Login ----------
docker-login:
  stage: docker-login
  script:
    - docker login -u $DOCKER_USR -p $DOCKER_PASS

# -------- Build & Push to Docker Hub ----------
build-push-conduit:
  stage: image-build-push
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - echo "Building Docker image..."
    - docker build -t $REGISTRY_TAG -f $CI_PROJECT_DIR/Dockerfile $CI_PROJECT_DIR
    - echo "Pushing image to Docker Hub..."
    - docker push $REGISTRY_TAG
    - echo "Tagging and pushing as latest..."
    - docker tag $REGISTRY_TAG ${DOCKER_USR}/nebula-conduit:latest
    - docker push ${DOCKER_USR}/nebula-conduit:latest
    - docker rmi --force $REGISTRY_TAG ${DOCKER_USR}/nebula-conduit:latest
  needs:
    - job: docker-login
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: 1 hour

# -------- Deploy to Kubernetes ----------
print-commons-path:
  stage: kubernetes-deploy
  image: bitnami/kubectl:1.27
  script:
    - echo "Fetching commons full path from running container..."
    - POD=$(kubectl get pods -n core-insights-nebula -l app=nebula-conduit -o jsonpath='{.items[0].metadata.name}')
    - kubectl exec $POD -n core-insights-nebula -- ls -la /app/commons
    - kubectl exec $POD -n core-insights-nebula -- realpath /app/commons
  needs:
    - job: build-push-conduit
  allow_failure: true

kubernetes-apply:
  stage: kubernetes-deploy
  image: bitnami/kubectl:1.27
  before_script:
    - echo "Printing kubectl version"
    - kubectl version --client
  script:
    - echo "Applying S3 ConfigMap"
    - kubectl apply -f $CI_PROJECT_DIR/k8s/s3-configmap.yaml --validate=false -n core-insights-nebula
    - echo "Applying GraphQL ConfigMap"
    - kubectl apply -f $CI_PROJECT_DIR/k8s/graphql-configmap.yaml --validate=false -n core-insights-nebula
    - echo "Applying Deployment"
    - kubectl apply -f $CI_PROJECT_DIR/k8s/deployment.yaml --validate=false -n core-insights-nebula
    - echo "Applying Service"
    - kubectl apply -f $CI_PROJECT_DIR/k8s/service.yaml --validate=false -n core-insights-nebula
  needs:
    - job: build-push-conduit

update-container-image:
  stage: kubernetes-deploy
  image: bitnami/kubectl:1.27
  script:
    - kubectl set image deployment/nebula-conduit nebula-conduit=$REGISTRY_TAG -n core-insights-nebula
    - kubectl rollout status deployment/nebula-conduit -n core-insights-nebula --timeout=900s
  needs:
    - job: kubernetes-apply
